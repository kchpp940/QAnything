# ============================================================
# macOS 平台 Docker Compose 配置（兼容入口）
# ⚠️  此文件为向后兼容保留，新结构请使用：
#     docker compose -f docker-compose.yaml -f docker-compose.mac.yaml up -d
# 所有环境变量默认值见 .env.example
# ============================================================

services:
  elasticsearch:
    container_name: es-container-local
    image: ${ES_IMAGE:-docker.elastic.co/elasticsearch/elasticsearch:8.13.2}
    user: root
    privileged: true
    ports:
      - "${ES_PORT:-9210}:9200"
    restart: on-failure
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1024m -Xmx1024m"
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/third_party/es/plugins:/usr/share/elasticsearch/plugins
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/es/data:/usr/share/elasticsearch/data
    command: >
      /bin/bash -c "
        mkdir -p /usr/share/elasticsearch/data /usr/share/elasticsearch/plugins &&
        chown -R elasticsearch:elasticsearch /usr/share/elasticsearch &&
        su elasticsearch -c '/usr/share/elasticsearch/bin/elasticsearch'
      "
    healthcheck:
      test: curl --fail http://localhost:9200/_cat/health || exit 1
      interval: 10s
      timeout: 20s
      retries: 3

  etcd:
    container_name: milvus-etcd-local
    image: ${ETCD_IMAGE:-quay.io/coreos/etcd:v3.5.5}
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 20s
      retries: 3

  minio:
    container_name: milvus-minio-local
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2023-03-20T20-16-18Z}
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 20s
      retries: 3

  standalone:
    container_name: milvus-standalone-local
    image: ${MILVUS_IMAGE:-milvusdb/milvus:v2.4.8}
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
    command: ["milvus", "run", "standalone"]
    security_opt:
    - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "${MILVUS_PORT:-19540}:19530"
    depends_on:
      - "etcd"
      - "minio"

  mysql:
    container_name: mysql-container-local
    privileged: true
    image: ${MYSQL_IMAGE:-mysql:8.4}
    ports:
      - "${MYSQL_PORT:-3316}:3306"
    command: --max-connections=10000
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_PASSWORD:-123456}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-qanything}
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/mysql:/var/lib/mysql

  qanything_local:
    container_name: qanything-container-local
    image: ${QANYTHING_IMAGE_MAC:-xixihahaliu01/qanything-mac:v1.5.1}
    command: /bin/bash -c "cd /workspace/QAnything && bash scripts/entrypoint.sh"
    privileged: true
    shm_size: '8gb'
    ports:
      - "${QANYTHING_PORT:-8777}:8777"
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/:/workspace/QAnything/
    environment:
      - NCCL_LAUNCH_MODE=PARALLEL
      - GPUID=${GPUID:--1}
      - USER_IP=${USER_IP:-0.0.0.0}
      - GATEWAY_IP=${GATEWAY_IP:-host.docker.internal}
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MILVUS_HOST=standalone
      - MILVUS_PORT=19530
      - ES_HOST=elasticsearch
      - ES_PORT=9200
      - EMBED_SERVICE_HOST=localhost
      - RERANK_SERVICE_HOST=localhost
      - OCR_SERVICE_HOST=localhost
      - PDF_PARSER_SERVICE_HOST=localhost
    depends_on:
      standalone:
        condition: service_healthy
      mysql:
        condition: service_started
      elasticsearch:
        condition: service_healthy
    tty: true
    stdin_open: true
