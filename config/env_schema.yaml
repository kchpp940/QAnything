# ============================================================
# QAnything 环境变量契约（机器可读 / 唯一权威来源）
# ============================================================
#
# ⚠️   此文件是所有环境变量的【单一事实来源】(Single Source of Truth)
#
# 🚫  不要手动修改以下文件：
#       ❌ .env.example    （由 scripts/generate_env_example.py 自动生成）
#
# 🛠️  新增/修改变量的标准流程：
#       1) ✏️  修改本文件（添加/修改变量条目）
#       2) 🔄  运行: python scripts/generate_env_example.py --write
#       3) ✅  校验: python scripts/validate_env.py
#       4) 🚀  启动: ./run.sh（会自动执行 --strict 校验）
#
# 📄 受此文件约束的配置：
#     compose     → docker-compose*.yaml 中的 ${VAR_NAME} 引用
#     dockerfile  → build_images/Dockerfile 中的 ENV 指令
#     backend     → qanything_kernel/configs/model_config.py 的 os.getenv()
#     frontend    → front_end/.env.* 和 vite.config.ts
#     template    → .env.example（自动生成，请勿手改）
#
# 每个变量条目字段说明：
#   name:          变量名（必填，唯一）
#   default:       默认值（必填，null 表示空字符串）
#   type:          类型: string | int | float | bool
#   required:      是否必填: true | false（默认 false）
#   category:      分类: runtime | mysql | milvus | es | services |
#                             kb | paths | frontend | images | other
#   used_in:       引用位置: [compose, dockerfile, backend, frontend]
#   description:   中文说明（必填，建议包含示例值）
#   deprecated:    是否已弃用: true | false（默认 false）
# ============================================================

schema_version: "1.0"

variables:

  # ----------------------------------------------------------
  # 一、基础运行配置
  # ----------------------------------------------------------
  - name: QANYTHING_HOST
    default: "0.0.0.0"
    type: string
    category: runtime
    used_in: [backend]
    description: 后端 API 服务绑定的 host 地址

  - name: QANYTHING_PORT
    default: 8777
    type: int
    category: runtime
    used_in: [compose, backend]
    description: 后端 API 服务端口号

  - name: QANYTHING_WORKERS
    default: 1
    type: int
    category: runtime
    used_in: [backend]
    description: Sanic worker 进程数量（本地开发建议 1，生产环境建议 4）

  - name: GPUID
    default: -1
    type: int
    category: runtime
    used_in: [compose, dockerfile]
    description: GPU 设备 ID，-1 表示使用 CPU

  - name: GATEWAY_IP
    default: "localhost"
    type: string
    category: runtime
    used_in: [compose, backend]
    description: "网关/宿主机 IP。本地:localhost，Docker Desktop:host.docker.internal，Docker Linux host模式:127.0.0.1"

  - name: USER_IP
    default: "localhost"
    type: string
    category: runtime
    used_in: [compose, backend]
    description: 用户访问 IP（仅用于打印访问地址，不影响实际监听）

  - name: STREAMING
    default: true
    type: bool
    category: runtime
    used_in: [backend, dockerfile]
    description: 是否启用流式响应

  # ----------------------------------------------------------
  # 二、MySQL 数据库连接
  # ----------------------------------------------------------
  - name: MYSQL_HOST
    default: "localhost"
    type: string
    category: mysql
    required: true
    used_in: [compose, backend, dockerfile]
    description: MySQL 数据库主机地址

  - name: MYSQL_PORT
    default: 3316
    type: int
    category: mysql
    required: true
    used_in: [compose, backend, dockerfile]
    description: MySQL 数据库端口（宿主机映射端口）

  - name: MYSQL_USER
    default: "root"
    type: string
    category: mysql
    required: true
    used_in: [backend, dockerfile]
    description: MySQL 用户名

  - name: MYSQL_PASSWORD
    default: "123456"
    type: string
    category: mysql
    required: true
    used_in: [compose, backend, dockerfile]
    description: MySQL 密码

  - name: MYSQL_DATABASE
    default: "qanything"
    type: string
    category: mysql
    required: true
    used_in: [compose, backend, dockerfile]
    description: MySQL 数据库名

  # ----------------------------------------------------------
  # 三、Milvus 向量数据库连接
  # ----------------------------------------------------------
  - name: MILVUS_HOST
    default: "localhost"
    type: string
    category: milvus
    required: true
    used_in: [compose, backend, dockerfile]
    description: Milvus 向量数据库主机地址

  - name: MILVUS_PORT
    default: 19540
    type: int
    category: milvus
    required: true
    used_in: [compose, backend, dockerfile]
    description: Milvus 向量数据库端口（宿主机映射端口）

  - name: MILVUS_COLLECTION_NAME
    default: "qanything_collection"
    type: string
    category: milvus
    used_in: [backend]
    description: Milvus Collection 名称前缀（会拼接 KB_SUFFIX）

  - name: ETCD_ENDPOINTS
    default: "localhost:2379"
    type: string
    category: milvus
    used_in: [backend]
    description: Milvus 依赖的 etcd 服务地址

  - name: MINIO_ADDRESS
    default: "localhost:9000"
    type: string
    category: milvus
    used_in: [backend]
    description: Milvus 依赖的 MinIO 服务地址

  - name: MINIO_ACCESS_KEY
    default: "minioadmin"
    type: string
    category: milvus
    used_in: [compose]
    description: MinIO 访问密钥

  - name: MINIO_SECRET_KEY
    default: "minioadmin"
    type: string
    category: milvus
    used_in: [compose]
    description: MinIO 密钥

  # ----------------------------------------------------------
  # 四、Elasticsearch 连接
  # ----------------------------------------------------------
  - name: ES_HOST
    default: "localhost"
    type: string
    category: es
    required: true
    used_in: [compose, backend, dockerfile]
    description: Elasticsearch 主机地址

  - name: ES_PORT
    default: 9210
    type: int
    category: es
    required: true
    used_in: [compose, backend, dockerfile]
    description: Elasticsearch 端口（宿主机映射端口）

  - name: ES_USER
    default: null
    type: string
    category: es
    used_in: [backend]
    description: Elasticsearch 用户名（未启用鉴权则留空）

  - name: ES_PASSWORD
    default: null
    type: string
    category: es
    used_in: [backend]
    description: Elasticsearch 密码（未启用鉴权则留空）

  - name: ES_INDEX_NAME
    default: "qanything_es_index"
    type: string
    category: es
    used_in: [backend]
    description: ES 索引名称前缀（会拼接 KB_SUFFIX）

  - name: ES_TOP_K
    default: 30
    type: int
    category: es
    used_in: [backend]
    description: ES 检索返回的 Top-K 数量

  # ----------------------------------------------------------
  # 五、本地依赖服务端口
  # ----------------------------------------------------------
  - name: EMBED_SERVICE_HOST
    default: "localhost"
    type: string
    category: services
    used_in: [compose, backend, dockerfile]
    description: Embedding 服务主机地址

  - name: EMBED_SERVICE_PORT
    default: 9001
    type: int
    category: services
    used_in: [backend, dockerfile]
    description: Embedding 服务端口

  - name: RERANK_SERVICE_HOST
    default: "localhost"
    type: string
    category: services
    used_in: [compose, backend, dockerfile]
    description: Rerank 服务主机地址

  - name: RERANK_SERVICE_PORT
    default: 8001
    type: int
    category: services
    used_in: [backend, dockerfile]
    description: Rerank 服务端口

  - name: OCR_SERVICE_HOST
    default: "localhost"
    type: string
    category: services
    used_in: [compose, backend, dockerfile]
    description: OCR 服务主机地址

  - name: OCR_SERVICE_PORT
    default: 7001
    type: int
    category: services
    used_in: [backend, dockerfile]
    description: OCR 服务端口

  - name: PDF_PARSER_SERVICE_HOST
    default: "localhost"
    type: string
    category: services
    used_in: [compose, backend, dockerfile]
    description: PDF 解析服务主机地址

  - name: PDF_PARSER_SERVICE_PORT
    default: 9009
    type: int
    category: services
    used_in: [backend, dockerfile]
    description: PDF 解析服务端口

  - name: INSERT_FILES_SERVICE_PORT
    default: 8110
    type: int
    category: services
    used_in: [backend, dockerfile]
    description: 文件入库异步服务端口

  # ----------------------------------------------------------
  # 六、知识库 / 检索配置
  # ----------------------------------------------------------
  - name: KB_SUFFIX
    default: "_240625"
    type: string
    category: kb
    used_in: [backend]
    description: 知识库版本后缀，区分不同版本的索引/表结构

  - name: VECTOR_SEARCH_TOP_K
    default: 30
    type: int
    category: kb
    used_in: [backend]
    description: 向量检索 Top-K 数量

  - name: VECTOR_SEARCH_SCORE_THRESHOLD
    default: 0.3
    type: float
    category: kb
    used_in: [backend]
    description: 向量检索分数阈值，低于此值的结果会被过滤

  - name: CACHED_VS_NUM
    default: 100
    type: int
    category: kb
    used_in: [backend]
    description: 缓存的向量库数量

  - name: SENTENCE_SIZE
    default: 100
    type: int
    category: kb
    used_in: [backend]
    description: 分句长度（字符数）

  - name: DEFAULT_CHILD_CHUNK_SIZE
    default: 400
    type: int
    category: kb
    used_in: [backend]
    description: 默认子块大小（字符数）

  - name: DEFAULT_PARENT_CHUNK_SIZE
    default: 800
    type: int
    category: kb
    used_in: [backend]
    description: 默认父块大小（字符数）

  - name: MAX_CHARS
    default: 1000000
    type: int
    category: kb
    used_in: [backend]
    description: 单个文件最大允许字符数，超过则标记为失败

  # ----------------------------------------------------------
  # 七、文件存储路径
  # ----------------------------------------------------------
  - name: UPLOAD_ROOT_PATH
    default: "QANY_DB/content"
    type: string
    category: paths
    used_in: [backend]
    description: 上传文件存储根目录（相对项目根目录）

  - name: DOCKER_VOLUME_DIRECTORY
    default: "."
    type: string
    category: paths
    used_in: [compose]
    description: Docker 卷挂载根目录（仅 compose 中使用）

  - name: TIKTOKEN_CACHE_DIR
    default: null
    type: string
    category: paths
    used_in: [dockerfile]
    description: TikToken 缓存目录（Dockerfile 中预填充）

  # ----------------------------------------------------------
  # 八、前端相关
  # ----------------------------------------------------------
  - name: VITE_APP_API_HOST
    default: "/api"
    type: string
    category: frontend
    used_in: [frontend]
    description: 前端 API 基地址（开发模式走代理，生产可填绝对地址）

  - name: VITE_APP_API_PREFIX
    default: "/api"
    type: string
    category: frontend
    used_in: [frontend]
    description: API 路由前缀

  - name: VITE_APP_WEB_PREFIX
    default: "/qanything"
    type: string
    category: frontend
    used_in: [frontend]
    description: 前端 Web 路径前缀

  - name: VITE_APP_MODE
    default: "dev"
    type: string
    category: frontend
    used_in: [frontend]
    description: "运行模式: dev | prod"

  - name: VITE_DEV_PROXY_TARGET
    default: "http://localhost:8777"
    type: string
    category: frontend
    used_in: [frontend]
    description: 开发模式 Vite 代理目标地址（指向后端 API）

  # ----------------------------------------------------------
  # 九、Docker 镜像配置
  # ----------------------------------------------------------
  - name: QANYTHING_IMAGE
    default: "xixihahaliu01/qanything-linux:v1.5.1"
    type: string
    category: images
    used_in: [compose]
    description: QAnything 主镜像占位符（被平台覆盖文件替换）

  - name: QANYTHING_IMAGE_LINUX
    default: "xixihahaliu01/qanything-linux:v1.5.1"
    type: string
    category: images
    used_in: [compose]
    description: Linux 平台 QAnything 镜像

  - name: QANYTHING_IMAGE_MAC
    default: "xixihahaliu01/qanything-mac:v1.5.1"
    type: string
    category: images
    used_in: [compose]
    description: macOS 平台 QAnything 镜像

  - name: QANYTHING_IMAGE_WIN
    default: "xixihahaliu01/qanything-win:v1.5.1"
    type: string
    category: images
    used_in: [compose]
    description: Windows 平台 QAnything 镜像

  - name: MILVUS_IMAGE
    default: "milvusdb/milvus:v2.4.8"
    type: string
    category: images
    used_in: [compose]
    description: Milvus 向量数据库镜像

  - name: ES_IMAGE
    default: "docker.elastic.co/elasticsearch/elasticsearch:8.13.2"
    type: string
    category: images
    used_in: [compose]
    description: Elasticsearch 镜像

  - name: ETCD_IMAGE
    default: "quay.io/coreos/etcd:v3.5.5"
    type: string
    category: images
    used_in: [compose]
    description: Etcd 镜像（Milvus 元数据存储）

  - name: MINIO_IMAGE
    default: "minio/minio:RELEASE.2023-03-20T20-16-18Z"
    type: string
    category: images
    used_in: [compose]
    description: MinIO 镜像（Milvus 对象存储）

  - name: MYSQL_IMAGE
    default: "mysql:8.4"
    type: string
    category: images
    used_in: [compose]
    description: MySQL 数据库镜像
