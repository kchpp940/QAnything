# ============================================================
# Windows 平台覆盖配置
# 使用：docker compose -f docker-compose.yaml -f docker-compose.win.yaml up -d
# ============================================================

services:
  qanything_local:
    image: ${QANYTHING_IMAGE_WIN:-xixihahaliu01/qanything-win:v1.5.1}
    ports:
      - "${QANYTHING_PORT:-8777}:8777"
    environment:
      - GATEWAY_IP=${GATEWAY_IP:-host.docker.internal}
